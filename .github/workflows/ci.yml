name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Generated l10n is committed, but hand-written Dart still needs a
      # consistent format. Skip the generated directory: it is rewritten
      # by flutter gen-l10n, not edited by hand.
      - name: Check Dart formatting
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            $(find lib test tool -name '*.dart' -not -path 'lib/core/l10n/generated/*')

      # The release manifest requests INTERNET (user decision 2026-10-30)
      # and CAMERA for Live. No permission is forbidden.
      - name: Assert release manifest permissions
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::Release manifest must request INTERNET permission."
            exit 1
          fi
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            echo "::error::Release manifest must request CAMERA for Live."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: analyze-test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # When release-signing secrets are configured (see docs/release-signing.md),
      # the build signs with the real keystore. Otherwise it falls back to the
      # debug key, as before. The keystore and key.properties below exist only
      # inside this ephemeral runner and are never committed.
      - name: Set up release signing (if secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release-signing secrets not configured; falling back to the debug key."
            exit 0
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error::Release signing is partially configured. Set ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "release.keystore"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK contents and permissions
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" > /tmp/nemro-apk-contents.txt
          for asset in \
            assets/flutter_assets/assets/eeg/s001_r04_60s.csv \
            assets/flutter_assets/assets/eeg/s001_r04_60s.json \
            assets/flutter_assets/assets/models/eeg_decoder.json; do
            if ! grep -q "$asset" /tmp/nemro-apk-contents.txt; then
              echo "::error::Missing $asset in the release APK."
              exit 1
            fi
          done
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not set."
            exit 1
          fi
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found in the Android SDK."
            exit 1
          fi
          "$AAPT2" dump permissions "$APK" > /tmp/nemro-permissions.txt
          cat /tmp/nemro-permissions.txt
          if ! grep -q 'android.permission.CAMERA' /tmp/nemro-permissions.txt; then
            echo "::error::Release APK is missing the CAMERA permission required by Live."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
