name: nemro
description: "Nemro — an open-source AI–brain loop lab for Android."
publish_to: "none"
repository: https://github.com/herbalblitz/nemro
issue_tracker: https://github.com/herbalblitz/nemro/issues
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.8.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.5.x pulls in package:jni, which requires the Android NDK and CMake at
  # build time. Nemro has no native code, so stay on the last pure-Kotlin
  # implementation to keep builds simple and fast.
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/eeg/
